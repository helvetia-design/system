name: 🚚 Snapshot

on:
  issue_comment:
    types: [created]

concurrency: snapshot-${{ github.event.issue.number }}

env:
  DS_RELEASE: true

jobs:
  snapshot:
    name: 🚚 Create Snapshot
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/snapshot') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Get Action URL
        id: action-url
        run: echo "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Notify in progress
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ github.event.comment.id }}
          edit-mode: replace
          body: |
            **🚚 Snapshot Version in Progress...**

            [Check out the release on GitHub ↗︎](${{ steps.action-url.outputs.url }})

      # github.event.issue.pull_request only carries URLs, not head/base info,
      # so the PR's latest commit has to come from the API.
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} --jq .head.sha)" >> "$GITHUB_OUTPUT"

      # Check out the exact sha so the snapshot version label matches the published code.
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      # No tokens here: this job never pushes, and the npm token is scoped to the Publish step only.
      - uses: ./.github/workflows/actions/setup-environment

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read current version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@3cf273023a0dda27efcd3164bdfb51908dd46a5b # v1.3.1
        with:
          path: packages/core

      - name: Determine snapshot version
        id: set-version
        run: |
          SHORT_SHA=$(git rev-parse --short ${{ steps.pr.outputs.sha }})
          echo "version=${{ steps.package-version.outputs.current-version }}-snapshot.${{ github.event.issue.number }}-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      # Bumps every workspace package's own version AND rewrites every internal
      # dependency pin that references another workspace package to match, so
      # pnpm's workspace link resolution (and turbo's build order) stay intact.
      - name: Sync workspace versions
        run: node scripts/sync-workspace-versions.mjs ${{ steps.set-version.outputs.version }}

      # pnpm's verify-deps-before-run check (which `pnpm exec turbo` triggers)
      # compares package.json specifiers against pnpm-lock.yaml and auto-runs
      # "pnpm install" to reconcile them — but CI forces --frozen-lockfile, so
      # that auto-install hard-fails on the versions we just bumped above.
      # Refresh the lockfile's bookkeeping (no re-resolve/download) so it goes
      # in already matching.
      - name: Refresh lockfile versions
        run: pnpm install --no-frozen-lockfile --lockfile-only

      - name: Build
        run: pnpm exec turbo run build --filter='./packages/*...'

      - name: Pre-Publish
        run: node scripts/pre-publish.mjs

      - name: Publish
        run: pnpm -r publish --no-git-checks --tag snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Notify success
        if: success()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ github.event.comment.id }}
          edit-mode: replace
          body: |
            **🚀 Snapshot Version Released!**

            Version: `${{ steps.set-version.outputs.version }}`

            [Check out the release on GitHub ↗︎](${{ steps.action-url.outputs.url }})

      - name: Notify failure
        if: failure()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ github.event.comment.id }}
          edit-mode: replace
          body: |
            **🚨 Snapshot Version Failed!**

            Version: `${{ steps.set-version.outputs.version }}`

            [Check out the release on GitHub ↗︎](${{ steps.action-url.outputs.url }})
