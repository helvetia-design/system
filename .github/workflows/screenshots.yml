name: 📸 Screenshots

# Update visual test screenshots for one or more components or foundation tests.
#
# Usage in PR comments:
#   /update-screenshots              - Update all components
#   /update-screenshots hint         - Update single component (hint)
#   /update-screenshots hint,popup   - Update multiple components (comma-separated)
#   /update-screenshots hint, popup, drawer - Spaces are trimmed automatically
#   /update-screenshots colors       - Update single foundation test (colors)
#
# The workflow:
# 1. Extracts component names from the comment
# 2. Splits comma-separated names and trims whitespace
# 3. Generates Playwright testMatch patterns for each component
# 4. Runs visual tests across Desktop Chrome and Mobile Chrome (untrusted PR code, read-only token)
# 5. Commits updated screenshots to the branch (separate job, no PR code executed)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed]

# `issue_comment` runs the workflow file from the default branch. Permissions are granted per job so
# the job running PR code only gets a read-only token; the bot PAT is only used in the commit job.
permissions: {}

jobs:
  assembleInformation:
    name: 📝 Assemble Information
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/update-screenshots') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      issues: write
      pull-requests: write
    env:
      HUSKY: 0
      CI: true
    outputs:
      action: ${{ steps.action.outputs.url }}
      branch: ${{ steps.branch.outputs.branch }}
      repo: ${{ steps.branch.outputs.repo }}
      command: ${{ steps.command.outputs.result }}
      specs: ${{ steps.specs.outputs.result }}
    steps:
      - name: Get Action URL
        id: action
        run: |
          echo "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Check for /update-screenshots command
        uses: actions/github-script@v9
        id: command
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const comment = context.payload.comment.body.trim();
            const regex = /\/update-screenshots(?:\s+(.*))?/;
            if (regex.test(comment)) {
              const match = comment.match(regex);
              const imageName = match[1] ? match[1].trim() : '';
              if(imageName !== ''){
                return imageName
              }
              return 'all'
            }
            return 'none'

      - name: Filter specs
        uses: actions/github-script@v9
        id: specs
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const comment = context.payload.comment.body.trim();
            const regex = /\/update-screenshots(?:\s+(.*))?/;
            if (regex.test(comment)) {
              const match = comment.match(regex);
              const imageName = match[1] ? match[1].trim() : '';
              if(imageName !== ''){
                return imageName.split(',').map(v => `${v}`);
              }
              return 'all'
            }
            return 'none'

      - name: Get results
        env:
          COMMAND: ${{ steps.command.outputs.result }}
          SPECS: ${{ steps.specs.outputs.result }}
        run: |
          echo "$COMMAND"
          echo "$SPECS"

      - name: Get Branch Name
        id: branch
        env:
          PR_URL: ${{ github.event.issue.pull_request.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$PR_URL")
          echo "branch=$(jq -r '.head.ref' <<< "$PR")" >> $GITHUB_OUTPUT
          echo "repo=$(jq -r '.head.repo.full_name' <<< "$PR")" >> $GITHUB_OUTPUT

      - name: Create comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ github.event.comment.id }}
          edit-mode: replace
          body: |
            **📸 Update Screenshots in Progress...**

            Specs: `${{ steps.command.outputs.result }}`

            [Check out the action on GitHub ↗︎](${{ steps.action.outputs.url }})

  # Runs untrusted PR code (install, build, Playwright): read-only token, no persisted credentials,
  # no PAT and no dependency cache (a cache saved from an `issue_comment` run is scoped to main).
  updateScreenshots:
    name: 📸 Update Screenshots
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/update-screenshots') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [assembleInformation]
    permissions:
      contents: read
    env:
      HUSKY: 0
      CI: true
      DS_PLAYWRIGHT_TESTING: 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - name: Show inputs from pree job
        env:
          BRANCH: ${{ needs.assembleInformation.outputs.branch }}
          COMMAND: ${{ needs.assembleInformation.outputs.command }}
          SPECS: ${{ needs.assembleInformation.outputs.specs }}
          ACTION: ${{ needs.assembleInformation.outputs.action }}
        run: |
          echo "Branch from pree job: $BRANCH"
          echo "Command: $COMMAND"
          echo "Specs: $SPECS"
          echo "Action: $ACTION"

      - name: Check out code
        uses: actions/checkout@v7
        with:
          # The PR head as GitHub stores it, so fork PRs test the fork's code, not a same-named base branch.
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core
        run: pnpm exec turbo run build --filter=@helvetia-design/core

      - name: Write visual config template
        run: |
          cat > packages/core/playwright.visual.config.mts <<'TS'
          /**
          * This configuration is used to run visual tests for a specific
          * component (or components), as well as foundation-level visual
          * tests (e.g. colors, typography), across multiple devices and browsers.
          *
          * Component selection:
          *   - If TAG is 'all', matches all components: src/components/all/test/*visual.play.ts
          *   - If TAG is 'hint,popup,drawer', generates separate patterns matched by
          *     file name anywhere under src/components (handles components nested
          *     inside a parent folder, e.g. snackbar/toast live under alert/test/):
          *   - Whitespace is trimmed from component names automatically
          *
          * Foundation selection:
          *   - Foundation visual tests live directly under src/foundation (no test subfolder)
          *   - The same name(s) from TAG are also matched there, e.g. TAG='colors' matches
          *     src/foundation/colors.visual.play.ts
          */
          import { defineConfig, devices } from '@playwright/test'
          import baseConfig from './playwright.config'

          const TAG = process.env.TAG ?? 'all'
          const components = TAG === 'all' ? ['all'] : TAG.split(',').map(t => t.trim())
          const componentsMatch = components.map(comp => comp === 'all' ? 'src/components/all/test/*visual.play.ts' : 'src/components/**/' + comp + '.visual.play.ts')
          const foundationMatch = components.map(comp => 'src/foundation/' + comp + '.visual.play.ts')
          const testMatch = [...componentsMatch, ...foundationMatch]

          console.log('testMatch', testMatch)

          export default defineConfig({
            ...baseConfig,
            projects: [
              {
                name: '🖼️ Visual / 💻 Desktop Chrome',
                testMatch,
                use: { ...devices['Desktop Chrome'] },
              },
              {
                name: '🖼️ Visual / 📱 Mobile Chrome',
                testMatch,
                use: { ...devices['Pixel 5'] },
              },
            ],
          })
          TS

      - name: Replace DS-TAG with provided tag
        run: |
          echo "---- file preview ----"
          sed -n '1,160p' packages/core/playwright.visual.config.mts
          echo "---- end preview ----"

      - name: Run Playwright tests
        working-directory: packages/core
        # Comment text reaches the config via env only, never via shell/source interpolation.
        env:
          TAG: ${{ needs.assembleInformation.outputs.command }}
        run: pnpm exec playwright test --config=playwright.visual.config.mts --update-snapshots

      - name: Collect changed screenshots
        id: collect
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          git ls-files -z --modified --others --exclude-standard -- 'packages/core/src/*.png' \
            | xargs -0 -r cp --parents -t "$RUNNER_TEMP/screenshots"
          if [ -n "$(ls -A "$RUNNER_TEMP/screenshots")" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload screenshots
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 1

  # Never executes PR code: only copies snapshot PNGs from the artifact into the branch and pushes.
  commitScreenshots:
    name: 💾 Commit Screenshots
    if: always() && needs.assembleInformation.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [assembleInformation, updateScreenshots]
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check test job and PR origin
        env:
          TEST_RESULT: ${{ needs.updateScreenshots.result }}
          HEAD_REPO: ${{ needs.assembleInformation.outputs.repo }}
          BASE_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.assembleInformation.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::Update Screenshots job did not succeed ($TEST_RESULT)"
            exit 1
          fi
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Refusing to push screenshots for a PR from another repository ($HEAD_REPO)"
            exit 1
          fi
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Refusing to push screenshots to the default branch"
            exit 1
          fi

      - name: Check out code
        if: needs.updateScreenshots.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.assembleInformation.outputs.branch }}
          token: ${{ secrets.DS_BOT_GITHUB_TOKEN }}

      - name: Download screenshots
        if: needs.updateScreenshots.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots

      # The artifact was produced by untrusted code: only take regular PNG files inside snapshot folders.
      - name: Apply screenshots
        if: needs.updateScreenshots.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/screenshots
        run: |
          find packages/core/src -type f -path '*-snapshots/*.png' -print0 \
            | xargs -0 -r cp --parents -t "$GITHUB_WORKSPACE"

      - name: Commit screenshots
        if: needs.updateScreenshots.outputs.changed == 'true'
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: packages/core/src
          author_name: Helvetia Design System
          author_email: design-system@helvetia.ch
          message: 'chore: update screenshots for ${{ needs.assembleInformation.outputs.command }}'

      - name: Create comment
        if: success()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ github.event.comment.id }}
          edit-mode: replace
          body: |
            **📸 Update Screenshots finished!**

            Specs: `${{ needs.assembleInformation.outputs.command }}`

            [Check out the action on GitHub ↗︎](${{ needs.assembleInformation.outputs.action }})

      - name: Create comment
        if: failure()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ github.event.comment.id }}
          edit-mode: replace
          body: |
            **🚨 Update Screenshots Failed!**

            Specs: `${{ needs.assembleInformation.outputs.command }}`

            [Check out the action on GitHub ↗︎](${{ needs.assembleInformation.outputs.action }})
