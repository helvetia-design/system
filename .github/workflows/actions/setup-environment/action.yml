name: 'Setup Environment'
description: 'Setup Git identity, Node.js environment, and NPM registry after checkout'
inputs:
  token:
    description: 'GitHub token (for configuring git remote)'
    required: false
  branch:
    description: 'Branch name (for info display)'
    required: false
  action:
    description: 'Action URL (for info display)'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Git Identity
      if: inputs.token != ''
      run: |
        git config --global user.name 'Helvetia Design System'
        git config --global user.email 'design-system@helvetia.ch'
        git remote set-url origin https://$GITHUB_ACTOR:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Show inputs from previous job
      if: inputs.branch != ''
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        ACTION: ${{ inputs.action }}
      run: |
        echo "Branch from previous job: $BRANCH"
        echo "Action: $ACTION"

    - name: Show current branch
      if: inputs.branch != ''
      shell: bash
      run: |
        echo "🔍 Current branch info:"
        git rev-parse --abbrev-ref HEAD
        echo "Full commit info:"
        git log -1 --oneline

    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js environment
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'
        ## setup-node writes a runner-temp .npmrc that reads NODE_AUTH_TOKEN at publish
        ## time; callers set it on the publish step only so other actions never see it.
        registry-url: 'https://registry.npmjs.org'
